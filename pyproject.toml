[project]
name = "colleague"
version = "0.1.0"
description = "A benchmark for agent harnesses: standing work, interruption, and many people sharing one assistant"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

# The harness, the recording proxy and every comparison-arm driver are
# stdlib-only on purpose, so an arm can be reproduced without installing
# anything from this project.
dependencies = []

[project.optional-dependencies]
# Only the unify arm needs these; it is metered in-process through a registered
# unillm event listener rather than through the recording proxy.
unify = ["unify", "unillm"]

# The arm runs against the sibling checkouts, not PyPI releases: it meters the
# runtime through unillm's listener API, so the two must be the versions being
# developed. Without these, `uv sync` resolves the names from PyPI — where
# `unify` is an unrelated package — and silently replaces the editable installs.
[tool.uv.sources]
unify = { path = "../unify", editable = true }
unillm = { path = "../unillm", editable = true }

[dependency-groups]
# The committed git hook and CI both run these, so they are locked here rather
# than pinned again in .pre-commit-config.yaml or in the workflow.
lint = [
    "black==25.1.0",
    "isort>=5.13",
    "autoflake>=2.3",
    "pre-commit>=3.0.1",
]
# The metering tests skip themselves when unillm is absent, so the suite still
# runs in a stdlib-only checkout.
test = ["pytest>=8.0"]
dev = [{ include-group = "lint" }, { include-group = "test" }]

[tool.black]
target-version = ["py312"]
# Committed run results are evidence, not source — see .pre-commit-config.yaml.
# Repeated here so a bare `black .` cannot rewrite the record either.
extend-exclude = "/results/"

[tool.isort]
profile = "black"
extend_skip_glob = ["*/results/*"]

[tool.setuptools.packages.find]
include = ["colleague*"]
