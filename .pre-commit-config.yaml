# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# Enable once per clone/worktree with:
#   python3 .agents/global-rules/ensure_git_hooks.py

# Committed run results are evidence: the exact bytes an arm produced, which a
# published figure is traced back to. Reformatting them would rewrite the
# record — stripping whitespace from a transcript, re-indenting a captured
# config, adding a newline an arm did not write — so every hook skips that tree.
exclude: |
  (?x)^(
    colleague/tracks/.*/results/.*
  )$

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: check-ast
  - id: trailing-whitespace
  - id: check-toml
  - id: end-of-file-fixer

- repo: https://github.com/asottile/add-trailing-comma
  rev: v3.1.0
  hooks:
  - id: add-trailing-comma

- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.14.0
  hooks:
  - id: pretty-format-yaml
    args:
    - --autofix
    - --preserve-quotes
    - --indent=2

- repo: local
  hooks:
  - id: autoflake
    name: autoflake
    entry: uv run autoflake
    language: system
    types: [python]
    args: [--in-place, --remove-all-unused-imports, --remove-duplicate-keys]
    exclude: |
      (?x)^(
        .*/__init__\.py      # Exclude all __init__.py files
      )$

  - id: isort
    name: Sort imports with isort
    entry: uv run isort
    language: system
    types: [python]

  - id: black
    name: Format with Black
    entry: uv run black
    language: system
    types: [python]
